name: Build CleanYourTV V16.9 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CleanYourTV-V12-folder-longpress-update.zip'
      - 'Launcher-V13-source.zip'
      - 'Launcher-V14-update-source.zip'
      - 'Launcher-V15-update-source.zip'
      - 'Launcher-V16.1-update-source.zip'
      - 'Launcher-V16.2-update-source.zip'
      - 'Launcher-V16.4-update-source.zip'
      - 'Launcher-V16.5-update-source.zip'
      - 'Launcher-V16.7-update-source.zip'
      - 'Launcher-V16.8-update-source.zip'
      - 'V16.9-source-download (1).zip'
      - 'cleanyourtv-main/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f 'V16.9-source-download (1).zip' ]; then
            unzip -q -o 'V16.9-source-download (1).zip' -d .
          elif [ -f Launcher-V16.8-update-source.zip ]; then
            unzip -q -o Launcher-V16.8-update-source.zip -d .
          elif [ -f Launcher-V16.7-update-source.zip ]; then
            unzip -q -o Launcher-V16.7-update-source.zip -d .
          elif [ -f Launcher-V16.5-update-source.zip ]; then
            unzip -q -o Launcher-V16.5-update-source.zip -d .
          elif [ -f Launcher-V16.4-update-source.zip ]; then
            unzip -q -o Launcher-V16.4-update-source.zip -d .
          elif [ -f Launcher-V16.2-update-source.zip ]; then
            unzip -q -o Launcher-V16.2-update-source.zip -d .
          elif [ -f Launcher-V16.1-update-source.zip ]; then
            unzip -q -o Launcher-V16.1-update-source.zip -d .
          elif [ -f Launcher-V15-update-source.zip ]; then
            unzip -q -o Launcher-V15-update-source.zip -d .
          elif [ -f Launcher-V14-update-source.zip ]; then
            unzip -q -o Launcher-V14-update-source.zip -d .
          elif [ -f Launcher-V13-source.zip ]; then
            unzip -q -o Launcher-V13-source.zip -d .
          elif [ -f CleanYourTV-V12-folder-longpress-update.zip ]; then
            unzip -q -o CleanYourTV-V12-folder-longpress-update.zip -d .
          fi
          # Repair literal line breaks accidentally embedded inside Java string literals in the weather panel.
          MAIN_JAVA="$(find . -type f -name MainActivity.java -path '*/com/gathin/tvhome/*' -print -quit)"
          if [ -n "$MAIN_JAVA" ]; then
            python3 - "$MAIN_JAVA" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          bad = 'append("' + chr(10) + '");'
          good = 'append("\\n");'
          if bad in s:
              s = s.replace(bad, good)
              p.write_text(s, encoding="utf-8")
              print("Repaired broken newline string literals in", p)
          else:
              print("No broken newline literals found in", p)
          PY
          fi
          GRADLEW="$(find . -type f -path '*/launcher/gradlew' -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::No launcher/gradlew found in the uploaded ZIP."
            find . -maxdepth 4 -type d | head -n 100
            exit 1
          fi
          LAUNCHER_DIR="$(dirname "$GRADLEW")"
          echo "LAUNCHER_DIR=$LAUNCHER_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Inspect folder and weather implementation
        shell: bash
        run: |
          set -euo pipefail
          MAIN_JAVA="$(find . -type f -name MainActivity.java -path '*/com/gathin/tvhome/*' -print -quit)"
          echo "MAIN_JAVA=$MAIN_JAVA"
          grep -n -i -E 'weather|一週天氣|system folder|系統|folder' "$MAIN_JAVA" | tail -n 100 || true
          echo "===== WEATHER CODE ====="
          WLINE="$(grep -n '一週天氣' "$MAIN_JAVA" | head -n 1 | cut -d: -f1 || true)"
          if [ -n "$WLINE" ]; then sed -n "$((WLINE-35)),$((WLINE+180))p" "$MAIN_JAVA"; fi
          echo "===== FOLDER CODE ====="
          grep -R -n -E 'systemFolder|SYSTEM_FOLDER|系統資料夾|system folder' "$(dirname "$MAIN_JAVA")" | head -n 100 || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager was not found on the GitHub runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: ${{ env.LAUNCHER_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-V16.9-debug-apk
          path: ${{ env.LAUNCHER_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
