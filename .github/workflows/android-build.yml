name: Build CleanYourTV V16.9 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CleanYourTV-V12-folder-longpress-update.zip'
      - 'Launcher-V13-source.zip'
      - 'Launcher-V14-update-source.zip'
      - 'Launcher-V15-update-source.zip'
      - 'Launcher-V16.1-update-source.zip'
      - 'Launcher-V16.2-update-source.zip'
      - 'Launcher-V16.4-update-source.zip'
      - 'Launcher-V16.5-update-source.zip'
      - 'Launcher-V16.7-update-source.zip'
      - 'Launcher-V16.8-update-source.zip'
      - 'V16.9-source-download (1).zip'
      - 'cleanyourtv-main/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f 'V16.9-source-download (1).zip' ]; then
            unzip -q -o 'V16.9-source-download (1).zip' -d .
          elif [ -f Launcher-V16.8-update-source.zip ]; then
            unzip -q -o Launcher-V16.8-update-source.zip -d .
          elif [ -f Launcher-V16.7-update-source.zip ]; then
            unzip -q -o Launcher-V16.7-update-source.zip -d .
          elif [ -f Launcher-V16.5-update-source.zip ]; then
            unzip -q -o Launcher-V16.5-update-source.zip -d .
          elif [ -f Launcher-V16.4-update-source.zip ]; then
            unzip -q -o Launcher-V16.4-update-source.zip -d .
          elif [ -f Launcher-V16.2-update-source.zip ]; then
            unzip -q -o Launcher-V16.2-update-source.zip -d .
          elif [ -f Launcher-V16.1-update-source.zip ]; then
            unzip -q -o Launcher-V16.1-update-source.zip -d .
          elif [ -f Launcher-V15-update-source.zip ]; then
            unzip -q -o Launcher-V15-update-source.zip -d .
          elif [ -f Launcher-V14-update-source.zip ]; then
            unzip -q -o Launcher-V14-update-source.zip -d .
          elif [ -f Launcher-V13-source.zip ]; then
            unzip -q -o Launcher-V13-source.zip -d .
          elif [ -f CleanYourTV-V12-folder-longpress-update.zip ]; then
            unzip -q -o CleanYourTV-V12-folder-longpress-update.zip -d .
          fi
          # Repair literal line breaks accidentally embedded inside Java string literals in the weather panel.
          MAIN_JAVA="$(find . -type f -name MainActivity.java -path '*/com/gathin/tvhome/*' -print -quit)"
          if [ -n "$MAIN_JAVA" ]; then
            python3 - "$MAIN_JAVA" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          bad = 'append("' + chr(10) + '");'
          good = 'append("\\n");'
          if bad in s:
              s = s.replace(bad, good)
              p.write_text(s, encoding="utf-8")
              print("Repaired broken newline string literals in", p)
          else:
              print("No broken newline literals found in", p)
          PY
          fi
          GRADLEW="$(find . -type f -path '*/launcher/gradlew' -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::No launcher/gradlew found in the uploaded ZIP."
            find . -maxdepth 4 -type d | head -n 100
            exit 1
          fi
          LAUNCHER_DIR="$(dirname "$GRADLEW")"
          echo "LAUNCHER_DIR=$LAUNCHER_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Fix system folder, Taoyuan weather and rounded dialog
        shell: bash
        run: |
          set -euo pipefail
          MAIN_JAVA="$(find . -type f -name MainActivity.java -path '*/com/gathin/tvhome/*' -print -quit)"
          python3 - "$MAIN_JAVA" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          old = '''            JSONObject geo = getJson("https://geocoding-api.open-meteo.com/v1/search?name=" + q + "&count=1&language=zh&format=json");
                      JSONArray results = geo.optJSONArray("results");
                      if (results == null || results.length() == 0) throw new IOException("找不到城市：" + city);
                      JSONObject place = results.getJSONObject(0);
                      fetchForecast(place.getDouble("latitude"), place.getDouble("longitude"), place.optString("name", city));'''
          new = '''            JSONObject geo = getJson("https://geocoding-api.open-meteo.com/v1/search?name=" + q + "&count=10&language=zh&format=json");
                      JSONArray results = geo.optJSONArray("results");
                      if (results == null || results.length() == 0) {
                          String fallback = city;
                          if (city.contains("桃園")) fallback = "Taoyuan";
                          else if (city.contains("台北") || city.contains("臺北")) fallback = "Taipei";
                          else if (city.contains("新北")) fallback = "New Taipei";
                          else if (city.contains("台中") || city.contains("臺中")) fallback = "Taichung";
                          else if (city.contains("台南") || city.contains("臺南")) fallback = "Tainan";
                          else if (city.contains("高雄")) fallback = "Kaohsiung";
                          String fq = URLEncoder.encode(fallback, "UTF-8");
                          geo = getJson("https://geocoding-api.open-meteo.com/v1/search?name=" + fq + "&count=10&language=en&format=json");
                          results = geo.optJSONArray("results");
                      }
                      if (results == null || results.length() == 0) throw new IOException("找不到城市：" + city);
                      JSONObject place = results.getJSONObject(0);
                      for (int i = 0; i < results.length(); i++) {
                          JSONObject candidate = results.getJSONObject(i);
                          if ("TW".equalsIgnoreCase(candidate.optString("country_code"))) { place = candidate; break; }
                      }
                      fetchForecast(place.getDouble("latitude"), place.getDouble("longitude"), city);'''
          if old in s:
              s = s.replace(old, new, 1)
          elif "fallback = \"Taoyuan\"" not in s:
              raise SystemExit("Could not locate expected city geocoding block; refusing unsafe patch")

          old = '''        List<ResolveInfo> all = getPackageManager().queryIntentActivities(
                      new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER), 0);
                  java.util.TreeMap<String, ResolveInfo> matches = new java.util.TreeMap<>(String.CASE_INSENSITIVE_ORDER);'''
          new = '''        PackageManager folderPm = getPackageManager();
                  java.util.LinkedHashMap<String, ResolveInfo> allByPackage = new java.util.LinkedHashMap<>();
                  List<ResolveInfo> tvLaunchers = folderPm.queryIntentActivities(
                          new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER), 0);
                  List<ResolveInfo> phoneLaunchers = folderPm.queryIntentActivities(
                          new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0);
                  if (tvLaunchers != null) for (ResolveInfo ri : tvLaunchers)
                      if (ri.activityInfo != null) allByPackage.put(ri.activityInfo.packageName, ri);
                  if (phoneLaunchers != null) for (ResolveInfo ri : phoneLaunchers)
                      if (ri.activityInfo != null && !allByPackage.containsKey(ri.activityInfo.packageName))
                          allByPackage.put(ri.activityInfo.packageName, ri);
                  List<ResolveInfo> all = new ArrayList<>(allByPackage.values());
                  java.util.TreeMap<String, ResolveInfo> matches = new java.util.TreeMap<>(String.CASE_INSENSITIVE_ORDER);'''
          if old in s:
              s = s.replace(old, new, 1)
          elif "phoneLaunchers = folderPm.queryIntentActivities" not in s:
              raise SystemExit("Could not locate expected folder launcher query; refusing unsafe patch")

          old = '''        new AlertDialog.Builder(this).setTitle("一週天氣").setView(content).setNegativeButton("取消", null)
                      .setPositiveButton("儲存", (dialog, which) -> {
                          boolean useCity = modes.getCheckedRadioButtonId() == cityMode.getId();
                          String value = city.getText().toString().trim();
                          prefs.edit().putBoolean("enabled", toggle.isChecked()).putString("location_mode", useCity ? "city" : "device")
                                  .putString("city", value.isEmpty() ? "桃園市" : value).apply();
                          refreshWeeklyWeatherVisibility();
                      }).show();'''
          new = '''        AlertDialog weatherDialog = new AlertDialog.Builder(this).setTitle("一週天氣").setView(content).setNegativeButton("取消", null)
                      .setPositiveButton("儲存", (dialog, which) -> {
                          boolean useCity = modes.getCheckedRadioButtonId() == cityMode.getId();
                          String value = city.getText().toString().trim();
                          prefs.edit().putBoolean("enabled", toggle.isChecked()).putString("location_mode", useCity ? "city" : "device")
                                  .putString("city", value.isEmpty() ? "桃園市" : value).apply();
                          refreshWeeklyWeatherVisibility();
                      }).create();
                  weatherDialog.setOnShowListener(ignored -> {
                      android.graphics.drawable.GradientDrawable rounded = new android.graphics.drawable.GradientDrawable();
                      rounded.setColor(Color.rgb(58, 62, 70));
                      rounded.setCornerRadius(22 * density);
                      rounded.setStroke(Math.max(1, (int) density), 0x30FFFFFF);
                      if (weatherDialog.getWindow() != null) weatherDialog.getWindow().setBackgroundDrawable(rounded);
                  });
                  weatherDialog.show();'''
          if old in s:
              s = s.replace(old, new, 1)
          elif "weatherDialog.setOnShowListener" not in s:
              raise SystemExit("Could not locate weather dialog; refusing unsafe patch")

          p.write_text(s, encoding="utf-8")
          print("Patched system folder app lookup, Taiwan city geocoding fallback and rounded weather dialog:", p)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager was not found on the GitHub runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: ${{ env.LAUNCHER_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-V16.9-debug-apk
          path: ${{ env.LAUNCHER_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
