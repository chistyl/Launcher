name: Build CleanYourTV V17 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CleanYourTV-V12-folder-longpress-update.zip'
      - 'Launcher-V13-source.zip'
      - 'Launcher-V14-update-source.zip'
      - 'Launcher-V15-update-source.zip'
      - 'Launcher-V16.1-update-source.zip'
      - 'Launcher-V16.2-update-source.zip'
      - 'Launcher-V16.4-update-source.zip'
      - 'Launcher-V16.5-update-source.zip'
      - 'Launcher-V16.7-update-source.zip'
      - 'Launcher-V16.8-update-source.zip'
      - 'V16.9-source-download (1).zip'
      - 'V16.9-source-fixed-v3.zip'
      - 'CleanYourTV-V17-source.zip'
      - 'cleanyourtv-main/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f 'CleanYourTV-V17-source.zip' ]; then
            unzip -q -o 'CleanYourTV-V17-source.zip' -d .
          elif [ -f 'V16.9-source-fixed-v3.zip' ]; then
            unzip -q -o 'V16.9-source-fixed-v3.zip' -d .
          elif [ -f 'V16.9-source-download (1).zip' ]; then
            unzip -q -o 'V16.9-source-download (1).zip' -d .
          elif [ -f Launcher-V16.8-update-source.zip ]; then
            unzip -q -o Launcher-V16.8-update-source.zip -d .
          elif [ -f Launcher-V16.7-update-source.zip ]; then
            unzip -q -o Launcher-V16.7-update-source.zip -d .
          elif [ -f Launcher-V16.5-update-source.zip ]; then
            unzip -q -o Launcher-V16.5-update-source.zip -d .
          elif [ -f Launcher-V16.4-update-source.zip ]; then
            unzip -q -o Launcher-V16.4-update-source.zip -d .
          elif [ -f Launcher-V16.2-update-source.zip ]; then
            unzip -q -o Launcher-V16.2-update-source.zip -d .
          elif [ -f Launcher-V16.1-update-source.zip ]; then
            unzip -q -o Launcher-V16.1-update-source.zip -d .
          elif [ -f Launcher-V15-update-source.zip ]; then
            unzip -q -o Launcher-V15-update-source.zip -d .
          elif [ -f Launcher-V14-update-source.zip ]; then
            unzip -q -o Launcher-V14-update-source.zip -d .
          elif [ -f Launcher-V13-source.zip ]; then
            unzip -q -o Launcher-V13-source.zip -d .
          elif [ -f CleanYourTV-V12-folder-longpress-update.zip ]; then
            unzip -q -o CleanYourTV-V12-folder-longpress-update.zip -d .
          fi
          # Repair literal line breaks accidentally embedded inside Java string literals in the weather panel.
          MAIN_JAVA="$(find . -type f -name MainActivity.java -path '*/com/gathin/tvhome/*' -print -quit)"
          if [ -n "$MAIN_JAVA" ]; then
            python3 - "$MAIN_JAVA" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          # Fix Java strings that were double-escaped and displayed literal \\n.
          s = s.replace('append("\\\\n");', 'append("\\n");')
          # Keep imports and direct system-folder fallback in sync with the patched V17 source.
          import_line = "import android.content.pm.PackageManager;"
          activity_import = "import android.content.pm.ActivityInfo;"
          if activity_import not in s:
              s = s.replace(import_line, import_line + "\n" + activity_import)
          marker = """        Dialog dialog = new Dialog(this);
        LinearLayout outer = new LinearLayout(this);"""
          fallback = """        // Some TV firmware exposes installed system apps through getLaunchIntentForPackage()
        // but omits them from LAUNCHER and LEANBACK_LAUNCHER category queries.
        // Resolve each remaining system-folder member directly so the folder does not appear empty.
        if (systemFolder) {
            for (String pkg : members) {
                if (matches.containsKey(pkg) || prefs.getBoolean("home_hidden_" + pkg, false)) continue;
                try {
                    Intent launchIntent = folderPm.getLaunchIntentForPackage(pkg);
                    if (launchIntent == null || launchIntent.getComponent() == null) continue;
                    ActivityInfo activity = folderPm.getActivityInfo(launchIntent.getComponent(), 0);
                    if (activity == null || !activity.exported) continue;
                    ResolveInfo fallbackInfo = new ResolveInfo();
                    fallbackInfo.activityInfo = activity;
                    matches.put(pkg, fallbackInfo);
                } catch (PackageManager.NameNotFoundException | RuntimeException ignored) { }
            }
        }

"""
          if marker in s and "Resolve each remaining system-folder member directly" not in s:
              s = s.replace(marker, fallback + marker, 1)
          bad = 'append("' + chr(10) + '");'
          good = 'append("\\n");'
          if bad in s:
              s = s.replace(bad, good)
          # Always write the patched source: system-folder fallback/import changes
          # must be saved even when the weather string already uses escaped newlines.
          p.write_text(s, encoding="utf-8")
          print("Saved V17 source patches in", p)
          PY
          fi
          GRADLEW="$(find . -type f -path '*/launcher/gradlew' -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::No launcher/gradlew found in the uploaded ZIP."
            find . -maxdepth 4 -type d | head -n 100
            exit 1
          fi
          LAUNCHER_DIR="$(dirname "$GRADLEW")"
          echo "LAUNCHER_DIR=$LAUNCHER_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager was not found on the GitHub runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Build V17 debug APK
        working-directory: ${{ env.LAUNCHER_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-V17-debug-apk
          path: ${{ env.LAUNCHER_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
