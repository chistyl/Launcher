name: Build CleanYourTV V17 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CleanYourTV-V17-source.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare V17 source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "CleanYourTV-V17-source.zip" ]; then
            echo "::error::CleanYourTV-V17-source.zip is missing from this branch."
            exit 1
          fi
          unzip -q -o "CleanYourTV-V17-source.zip" -d .
          MAIN_JAVA="$(find . -type f -name MainActivity.java -path '*/com/gathin/tvhome/*' -print -quit)"
          if [ -z "$MAIN_JAVA" ]; then
            echo "::error::MainActivity.java was not found."
            exit 1
          fi
          python3 - "$MAIN_JAVA" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          # Correct literal backslash-n sequences in forecast lines.
          s = s.replace('append("\\\\n");', 'append("\\n");')
          # Restore V16.8's known-working system-folder enumeration.
          import re
          old_block = re.compile(r'        if \(systemFolder\) \{\n            // Enumerate installed packages first,[\s\S]*?            members = current;\n        \} else \{', re.M)
          new_block = """        if (systemFolder) {
                      List<ResolveInfo> installed = getPackageManager().queryIntentActivities(
                              new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER), 0);
                      java.util.HashSet<String> current = new java.util.HashSet<>(prefs.getStringSet(
                              "system_folder_added", java.util.Collections.<String>emptySet()));
                      Set<String> excluded = prefs.getStringSet("system_folder_excluded", java.util.Collections.<String>emptySet());
                      for (ResolveInfo ri : installed) {
                          if (ri.activityInfo == null || !ri.activityInfo.exported || ri.activityInfo.packageName.equals(getPackageName())) continue;
                          try {
                              int flags = getPackageManager().getApplicationInfo(ri.activityInfo.packageName, 0).flags;
                              if ((flags & (ApplicationInfo.FLAG_SYSTEM | ApplicationInfo.FLAG_UPDATED_SYSTEM_APP)) != 0
                                      && !excluded.contains(ri.activityInfo.packageName)) current.add(ri.activityInfo.packageName);
                          } catch (PackageManager.NameNotFoundException ignored) { }
                      }
                      members = current;
                  } else {"""
          s, count = old_block.subn(new_block, s, count=1)
          print("V16.8 system-folder block replacements:", count)
          # Use fixed-width tiles as in V16.8 so GridLayout does not collapse weighted cells on TV firmware.
          s = re.sub(r'android\.widget\.GridLayout\.LayoutParams lp = new android\.widget\.GridLayout\.LayoutParams\(\s*android\.widget\.GridLayout\.spec\(grid\.getChildCount\(\) % folderColumns, 1, 1f\),\s*android\.widget\.GridLayout\.spec\(android\.widget\.GridLayout\.UNDEFINED\)\);\s*lp\.width = 0;[^\n]*',
                     'android.widget.GridLayout.LayoutParams lp = new android.widget.GridLayout.LayoutParams();\\n                lp.width = (int)(folderTileDp*density);', s)
          # Add a weather glyph next to the condition label.
          s = s.replace('.append(day).append("  ").append(weatherLabel(code))',
                        '.append(day).append("  ").append(weatherIcon(code)).append("  ").append(weatherLabel(code))')
          if "private String weatherIcon(int code)" not in s:
              helper = """    private String weatherIcon(int code) {
                  if (code == 0) return "☀️";
                  if (code == 1 || code == 2) return "🌤️";
                  if (code == 3) return "☁️";
                  if (code == 45 || code == 48) return "🌫️";
                  if (code >= 51 && code <= 67) return "🌧️";
                  if (code >= 71 && code <= 77) return "❄️";
                  if (code >= 80 && code <= 82) return "🌦️";
                  if (code >= 95) return "⛈️";
                  return "🌡️";
              }

          """
              s = s.replace("    private String weatherLabel(int code)", helper + "    private String weatherLabel(int code)", 1)
          # V16.8-style folder layout: three equal columns with symmetric outer gutters.
          s = s.replace("int folderColumns = 4;", "int folderColumns = 3;")
          # The top bar must not retain ALIGN_BOTTOM from XML when ALIGN_TOP is applied at runtime.
          s = s.replace("tlp.addRule(RelativeLayout.ALIGN_TOP, R.id.leftBlock);",
                        "tlp.addRule(RelativeLayout.ALIGN_TOP, R.id.leftBlock);\\n            tlp.addRule(RelativeLayout.ALIGN_BOTTOM, 0);")
          # Make weather glyphs visually prominent, closer to the supplied reference rather than tiny inline symbols.
          weather_set = 'weeklyWeatherView.setText(result);'
          weather_replacement = 'weeklyWeatherView.setText(styleWeatherForecast(result));'
          s = s.replace(weather_set, weather_replacement)
          if "private CharSequence styleWeatherForecast(String value)" not in s:
              style_helper = """    private CharSequence styleWeatherForecast(String value) {
                  android.text.SpannableStringBuilder styled = new android.text.SpannableStringBuilder(value);
                  String[] icons = {"☀️", "🌤️", "☁️", "🌫️", "🌧️", "❄️", "🌦️", "⛈️", "🌡️"};
                  for (String icon : icons) {
                      int from = 0;
                      while ((from = value.indexOf(icon, from)) >= 0) {
                          styled.setSpan(new android.text.style.RelativeSizeSpan(1.55f), from,
                                  from + icon.length(), android.text.Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                          from += icon.length();
                      }
                  }
                  return styled;
              }

          """
              s = s.replace("    private String weatherLabel(int code)", style_helper + "    private String weatherLabel(int code)", 1)
          p.write_text(s, encoding="utf-8")
          # Keep Wi-Fi/settings at the top of the header instead of bottom-aligning with the taller weather block.
          for xml in p.parent.parent.parent.glob("**/res/layout/activity_main.xml"):
              x = xml.read_text(encoding="utf-8")
              x = x.replace('android:layout_alignBottom="@id/leftBlock"\\n                android:layout_marginBottom="6dp"',
                            'android:layout_alignParentTop="true"\\n                android:layout_marginTop="10dp"')
              xml.write_text(x, encoding="utf-8")
          print("Applied V16.8 folder, weather icons, and top-button positioning.")

          print("Prepared source:", p)
          PY
          GRADLEW="$(find . -type f -path '*/launcher/gradlew' -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::No launcher/gradlew found in source archive."
            find . -maxdepth 5 -type d | head -n 100
            exit 1
          fi
          LAUNCHER_DIR="$(dirname "$GRADLEW")"
          echo "LAUNCHER_DIR=$LAUNCHER_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager was not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Build V17 debug APK
        working-directory: ${{ env.LAUNCHER_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-V17-debug-apk
          path: ${{ env.LAUNCHER_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
