name: Build CleanYourTV V17 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CleanYourTV-V17-source.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare V17 source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "CleanYourTV-V17-source.zip" ]; then
            echo "::error::CleanYourTV-V17-source.zip is missing from this branch."
            exit 1
          fi
          unzip -q -o "CleanYourTV-V17-source.zip" -d .
          MAIN_JAVA="$(find . -type f -name MainActivity.java -path '*/com/gathin/tvhome/*' -print -quit)"
          if [ -z "$MAIN_JAVA" ]; then
            echo "::error::MainActivity.java was not found."
            exit 1
          fi
          python3 - "$MAIN_JAVA" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          # Correct literal backslash-n sequences in forecast lines.
          s = s.replace('append("\\\\n");', 'append("\\n");')
          # Ensure source changes are persisted even if no weather replacement was needed.
          p.write_text(s, encoding="utf-8")
          print("Prepared source:", p)
          PY
          GRADLEW="$(find . -type f -path '*/launcher/gradlew' -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::No launcher/gradlew found in source archive."
            find . -maxdepth 5 -type d | head -n 100
            exit 1
          fi
          LAUNCHER_DIR="$(dirname "$GRADLEW")"
          echo "LAUNCHER_DIR=$LAUNCHER_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager was not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Build V17 debug APK
        working-directory: ${{ env.LAUNCHER_DIR }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-V17-debug-apk
          path: ${{ env.LAUNCHER_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
