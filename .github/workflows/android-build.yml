name: Build CleanYourTV V14 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CleanYourTV-V12-folder-longpress-update.zip'
      - 'Launcher-V13-source.zip'
      - 'Launcher-V14-update-source.zip'
      - 'cleanyourtv-main/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Launcher-V14-update-source.zip ]; then
            unzip -q -o Launcher-V14-update-source.zip -d .
          elif [ -f Launcher-V13-source.zip ]; then
            unzip -q -o Launcher-V13-source.zip -d .
          elif [ -f CleanYourTV-V12-folder-longpress-update.zip ]; then
            unzip -q -o CleanYourTV-V12-folder-longpress-update.zip -d .
          fi
          if [ ! -f cleanyourtv-main/launcher/gradlew ]; then
            echo "::error::V14/V13 source is missing. The ZIP must contain cleanyourtv-main/launcher/gradlew."
            exit 1
          fi
          chmod +x cleanyourtv-main/launcher/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager was not found on the GitHub runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: cleanyourtv-main/launcher
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-V14-debug-apk
          path: cleanyourtv-main/launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
